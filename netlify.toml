# Netlify Configuration for ShieldText

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"
  ignore = "if [ -z \"$CACHED_COMMIT_REF\" ] || [ \"$COMMIT_REF\" = \"$CACHED_COMMIT_REF\" ]; then exit 1; else git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- . ../netlify.toml ../netlify ../package.json; fi"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["netlify/functions/*.json"]

# Direct static delivery for academic presentation & report PDFs
[[redirects]]
  from = "/api/info/presentation-pdf"
  to = "/docs/ShieldText_Class_Presentation.pdf"
  status = 200
  force = true

[[redirects]]
  from = "/api/info/report-pdf"
  to = "/docs/ShieldText_Detailed_Report.pdf"
  status = 200
  force = true

# Health check and exact /api root route
[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200
  force = true

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# Route API calls to Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Client-side routing for Single Page Application
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
